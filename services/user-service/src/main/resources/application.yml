server:
    port: 8082

spring:
    application:
        name: user-service

    datasource:
        url: jdbc:postgresql://localhost:5433/user_db
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate

        open-in-view: false

        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8080/realms/enterprise

keycloak:
    serverUrl: http://localhost:8080
    realm: enterprise
    client-id: auth-service
    client-secret: wdzwDmfgof5rOwh0ELH59jmzo86XYJPi

logging:
    level:
        root: INFO
        org.springframework.security: INFO

springdoc:
    api-docs:
        path: /api-docs

    swagger-ui:
        path: /swagger-ui.html
